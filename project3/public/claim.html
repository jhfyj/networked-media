<!-- this is the page the qr code goes to. made for phones -->
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Claim a spot</title>
		<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400&display=swap" rel="stylesheet" />
		<link href="style.css" rel="stylesheet" />
		<script src="claim.js"></script>
	</head>
	<body class="phone">
		<!-- STEP 1: pick a blob -->
		<div id="step1">
			<div class="top-bar">
				<a class="back" href="/"><img src="assets/icon-back.svg" alt="back" /></a>
				<p>Choose one of the spaces below</p>
			</div>
			<!-- same 20 blobs as the directory. claim.js turns the taken ones gray -->
			<div id="picker">
				<img class="pick-blob" id="pick0" src="assets/blob-red.svg" alt="" />
				<img class="pick-blob" id="pick1" src="assets/blob-orange.svg" alt="" />
				<img class="pick-blob" id="pick2" src="assets/blob-green.svg" alt="" />
				<img class="pick-blob" id="pick3" src="assets/blob-blue.svg" alt="" />
				<img class="pick-blob" id="pick4" src="assets/blob-orange.svg" alt="" />
				<img class="pick-blob" id="pick5" src="assets/blob-orange.svg" alt="" />
				<img class="pick-blob" id="pick6" src="assets/blob-red.svg" alt="" />
				<img class="pick-blob" id="pick7" src="assets/blob-red.svg" alt="" />
				<img class="pick-blob" id="pick8" src="assets/blob-green.svg" alt="" />
				<img class="pick-blob" id="pick9" src="assets/blob-red.svg" alt="" />
				<img class="pick-blob" id="pick10" src="assets/blob-orange.svg" alt="" />
				<img class="pick-blob" id="pick11" src="assets/blob-green.svg" alt="" />
				<img class="pick-blob" id="pick12" src="assets/blob-red.svg" alt="" />
				<img class="pick-blob" id="pick13" src="assets/blob-orange.svg" alt="" />
				<img class="pick-blob" id="pick14" src="assets/blob-blue.svg" alt="" />
				<img class="pick-blob" id="pick15" src="assets/blob-green.svg" alt="" />
				<img class="pick-blob" id="pick16" src="assets/blob-orange.svg" alt="" />
				<img class="pick-blob" id="pick17" src="assets/blob-blue.svg" alt="" />
				<img class="pick-blob" id="pick18" src="assets/blob-red.svg" alt="" />
				<img class="pick-blob" id="pick19" src="assets/blob-orange.svg" alt="" />
			</div>
		</div>

		<!-- STEP 2: draw + add info -->
		<!-- hidden until they pick a blob -->
		<div id="step2">
			<div class="top-bar">
				<button class="back" id="back-button"><img src="assets/icon-back.svg" alt="back" /></button>
			</div>

			<!-- action: route on the server. method: POST -->
			<form id="profile-form" action="/add-designer" method="POST">
				<p>draw your face on the blob!</p>

				<!-- the drawing area. blob picture in the back, canvas on top -->
				<!-- width + height have to be on the canvas tag itself or the drawing gets stretched -->
				<div id="canvas-box">
					<img id="canvas-blob" alt="" />
					<canvas id="draw-canvas" width="200" height="240"></canvas>
				</div>

				<div id="tools">
					<!-- pen + eraser icons are from figma -->
					<button type="button" id="pen" class="tool selected"><img src="assets/icon-pen.svg" alt="pen" /></button>
					<button type="button" id="eraser" class="tool"><img src="assets/icon-erase.svg" alt="eraser" /></button>
				</div>

				<!-- hidden inputs. claim.js puts the spot + the drawing png in here right before it sends -->
				<input type="hidden" name="spot" id="spot-input" />
				<input type="hidden" name="drawing" id="drawing-input" />

				<label>First Name</label>
				<input type="text" name="firstName" placeholder="Jennifer" />

				<label>Last Name</label>
				<input type="text" name="lastName" placeholder="Huang" />

				<label>Role</label>
				<select name="role">
					<option value="Product Design">Product Designer</option>
					<option value="Brand Design">Brand Designer</option>
					<option value="Graphic Design">Graphic Designer</option>
					<option value="UX Research">UX Researcher</option>
					<option value="Motion Design">Motion Designer</option>
					<option value="Design Engineering">Design Engineer</option>
					<option value="Illustration">Illustrator</option>
				</select>

				<label>Website</label>
				<input type="text" name="website" placeholder="yourwebsite.com" />

				<input type="submit" value="SUBMIT" class="black-button" />
			</form>
		</div>
	</body>
</html>
