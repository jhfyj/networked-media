<html>
	<!-- Q: What type of content goes inside the <head>? 
    
    Does it show up on the webpage? -->
	<!-- A:The head shows information about the website that will not be displayed on the web. Metainformation-->

	<head>
		<title>class 5 demo 😌</title>
		<link rel="stylesheet" href="style.css" />
		<link rel="icon" href="favicon.png" />
		<!-- NEW link js file -->
		<script src="main.js"></script>
		<!-- rel= relationship -->
	</head>

	<!-- Q: What type of content goes inside the <body>?   
    Does it show up on the webpage? -->
	<!-- A:The body displays everything that will show up in the website, hence the content. -->

	<body>
		<p>this is a paragraph</p>
		<p class="blue">this is a second paragraph</p>
		<p id="main">this is a third paragraph</p>

		<!-- now open up style.css -->
	</body>
</html>
